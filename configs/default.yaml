# Default scenario = the organisers' COMPETITION_SIM, expressed as parameters.
# With seed 100 (the value hard-coded in the organisers' SpawnDebris.py) the
# untouched Assets/Repos/STU4-Sim/Sims/COMPETITION_SIM.simconf is used as-is.
# Any other seed, or any changed value below, makes scripts/make_config.py bake
# a new debris field into Assets/Repos/STU4-Eval/Sims/ (the organisers' files
# are never written).
name: default

debris:
  num: 500                 # SpawnDebris NumDebris
  spread_m: [300.0, 300.0, 500.0]
  vertical_offset_m: 500.0
  weights: [0.45, 0.35, 0.15, 0.05]   # Rock1, Rock2, Rock3, ExplodedTank
  speed_frac: [0.05, 0.10]            # of sqrt(mu/R) = 7.98 m/s  ->  0.40 .. 0.80 m/s
  scale_mult: 1.0          # multiplies every rock's ScaleMin/ScaleMax (size)
  angvel_max_rad_s: 0.2

radar:
  num: 200                 # how many of the debris the radar reports (Debris0..num-1)
  position_1sigma_m: 2.0
  velocity_1sigma_m_s: 0.02
  diameter_1sigma_fraction: 0.05
  loop_hz: 120.0

scoring:
  DamageThreshold_J: 209200.0
  NominalFuel_kg: 1.15
  NominalTime_s: 120.0
  KeepOutRadius_m: 50.0

shuttle:
  max_accel_m_s2: 0.5
  max_ang_accel_rad_s2: 0.05
  controller_loop_hz: 60.0
