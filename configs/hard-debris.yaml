# Hard debris field only.  Radar, scoring and shuttle are NOT listed here, so
# they fall back to the competition values (same noise, same thresholds, same
# thrust cap, same keep-out).  Only the rocks are harder: more of them, closer
# together, faster and bigger.  A controller tuned here sees exactly the
# sensors and scoring it will meet in the competition.
name: hard-debris

debris:
  num: 700                          # 500 -> 700 rocks
  spread_m: [220.0, 220.0, 450.0]   # tighter box: ~2.9x the number density of the default field
  vertical_offset_m: 500.0          # unchanged
  weights: [0.35, 0.35, 0.15, 0.15] # 3x more 17 m exploded tanks
  speed_frac: [0.10, 0.20]          # 0.8 .. 1.6 m/s, twice the default speed
  scale_mult: 1.3                   # rocks 30 % wider (2.2x mass)
  angvel_max_rad_s: 0.2             # unchanged
